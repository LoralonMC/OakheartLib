base {
    archivesName = 'oakheart-core'
}

repositories {
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.1.2.build.+'
}

publishing {
    publications {
        maven {
            artifactId = 'oakheart-core'
        }
    }
}
