base {
    archivesName = 'oakheart-core'
}

repositories {
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3.build.+'
    // Adventure / MiniMessage (bundled with paper-api) for message-rendering tests, and the
    // Bukkit enums the click policy tests use.
    testImplementation 'io.papermc.paper:paper-api:26.3.build.+'
    // Paper bundles the SQLite driver at runtime; the SqliteStore tests need their own copy.
    testRuntimeOnly 'org.xerial:sqlite-jdbc:3.47.1.0'
}

publishing {
    publications {
        maven {
            artifactId = 'oakheart-core'
        }
    }
}
